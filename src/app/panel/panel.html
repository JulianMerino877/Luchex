<div class="system-layout" [class.collapsed]="collapsed()">
  <aside class="sidebar" aria-label="Menú del sistema">
    <a class="brand" routerLink="/panel/clientes" aria-label="Luchex, inicio">
      <img src="assets/images/logo1.png" alt="Luchex, mecánica de motos" />
      <span>LUCHEX</span>
    </a>

    <div class="menu-toolbar">
      <button class="icon-button" type="button" (click)="collapsed.set(!collapsed())"
        [attr.aria-label]="collapsed() ? 'Expandir menú' : 'Contraer menú'"
        [attr.aria-expanded]="!collapsed()" aria-controls="modules">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16 M4 12h16 M4 19h16" /></svg>
      </button>
    </div>

    <nav id="modules" aria-label="Módulos">
      @for (module of modules; track module.path) {
        <a class="module-link" [routerLink]="['/panel', module.path]" routerLinkActive="active"
          ariaCurrentWhenActive="page" [attr.aria-label]="module.label" [title]="module.label">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path [attr.d]="module.icon" /></svg>
          <span class="module-label">{{ module.label }}</span>
        </a>
      }
    </nav>

    <div class="account-area">
      @if (error()) { <p class="error-message" role="alert">{{ error() }}</p> }
      <div class="account" [attr.aria-busy]="closing()">
        <span class="avatar" aria-hidden="true">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4" /><path d="M4 22v-4a8 8 0 0 1 16 0v4" /></svg>
        </span>
        <span class="account-label" [title]="auth.user()?.email ?? ''">Administrador</span>
        <button class="icon-button logout" type="button" (click)="logout()" [disabled]="closing()"
          aria-label="Cerrar sesión" title="Cerrar sesión">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3H3v18h6 M10 12h12 m-6-6 6 6-6 6" /></svg>
        </button>
      </div>
    </div>
  </aside>

  <main class="panel-content" aria-label="Contenido del módulo">
    <router-outlet />
  </main>
</div>
